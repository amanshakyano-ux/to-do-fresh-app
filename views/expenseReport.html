<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="container page">
        <header class="page-header">
            <div>
                <h1>Expense Report</h1>
                <p class="muted">Filter by interval and review totals.</p>
            </div>
        </header>

        <div id="report-bar" class="action-group">
            <label for="limit-select" class="small-label">Items</label>
            <select id="limit-select">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="40">40</option>
            </select>
            <button id="daily" type="button">Daily</button>
            <button id="weekly" type="button">Weekly</button>
            <button id="monthly" type="button">Monthly</button>
            <button type="button" id="download-list">Download</button>
        </div>

        <ul id="timely-exp"></ul>
        <p id="totalExp"></p>
        <div id="pagination"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" referrerpolicy="no-referrer"></script>
    <script src="/expenseReport.js"></script>
</body>
</html>
