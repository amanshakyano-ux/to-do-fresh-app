<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login Here</title>
   <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="container page">
        <header class="page-header">
            <div>
                <h1>Login</h1>
                <p class="muted">Access your account and manage expenses.</p>
            </div>
        </header>

        <form onsubmit="handleForm(event)">
            <div class="field-row">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="field-row">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit">Login</button>
            <button id="reset-pass" type="button" class="secondary-btn">Reset Password</button>
        </form>

        <p id="response-msg"></p>
        <p class="muted">Don’t have an account? <a href="/signup.html">Sign Up</a></p>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" referrerpolicy="no-referrer"></script>
    <script src="/login.js"></script>
</body>
</html>
