<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNUP </title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="container page">
        <header class="page-header">
            <div>
                <h1>Sign Up</h1>
                <p class="muted">Create your account and start tracking expenses.</p>
            </div>
        </header>

        <form onsubmit="signup(event)">
            <div class="field-row">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="field-row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field-row">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign Up</button>
        </form>

        <p id="response-msg"></p>
        <p class="muted"><a href="/login.html">Already have an account? Login</a></p>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" referrerpolicy="no-referrer"></script>
    <script src="/signup.js"></script>
</body>
</html>
