<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="container page">
        <header class="page-header">
            <div>
                <h1>Reset Password</h1>
                <p class="muted">Enter the email address associated with your account.</p>
            </div>
        </header>

        <form onsubmit="resetForm(event)">
            <div class="field-row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="email@gmail.com" required>
            </div>
            <button type="submit">Send Link</button>
        </form>

        <p id="response-msg"></p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" referrerpolicy="no-referrer"></script>
    <script src="/login.js"></script>
</body>
</html>
